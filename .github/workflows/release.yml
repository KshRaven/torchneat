name: Release

# Runs when a version tag is pushed (`python scripts/pypimgr/pypimgr.py release patch --push` does this for you).
# It re-checks and builds, then publishes to TestPyPI and PyPI through Trusted Publishers (GitHub OIDC).
# GPU tests need a CUDA device and are not run here; run `pytest -m gpu` locally before tagging.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CI: "true"
  PYTHONUTF8: "1"

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev]"
      - run: pytest -q -m "not gpu"
      - run: python scripts/pypimgr/pypimgr.py build
        env:
          PYPIMGR_NO_VENV: "1"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: .cache/pypimgr/torchneat/artifacts/*
          if-no-files-found: error

  release:
    name: GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/pypimgr/pypimgr.py notes "${GITHUB_REF_NAME}" > notes.md
        env:
          PYPIMGR_NO_VENV: "1"
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "$GITHUB_REF_NAME" --yes --cleanup-tag=false 2>/dev/null || true
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/torchneat
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish:
    name: Publish to PyPI
    needs: [build, publish-testpypi]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/torchneat
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
