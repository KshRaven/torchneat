[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "torchneat"
dynamic = ["version", "optional-dependencies"]
description = "TorchNEAT - GPU/CPU accelerated neuroevolution for PyTorch modules"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Bradley Odimmasi" }]
requires-python = ">=3.10"
keywords = ["neuroevolution", "neat", "pytorch", "evolutionary algorithms", "reinforcement learning", "numba"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "numpy",
    "numba",
    "torch",
    "colorama",
]

# Extras (gpu, logging, all, dev) are defined in setup.py; gpu pins the CUDA libraries to the installed driver.
# Set TORCHNEAT_CUDA=cpu|auto|X.Y to override detection. `torchneat-install` also picks the matching PyTorch wheel index.
[project.scripts]
torchneat-install = "torchneat._install:main"


[project.urls]
Homepage = "https://github.com/KshRaven/torchneat"
Documentation = "https://github.com/KshRaven/torchneat#readme"
Source = "https://github.com/KshRaven/torchneat"
Issues = "https://github.com/KshRaven/torchneat/issues"
Changelog = "https://github.com/KshRaven/torchneat/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "torchneat._version.__version__" }

[tool.setuptools.packages.find]
include = ["torchneat*"]

[tool.setuptools.package-data]
torchneat = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Always import the package from this checkout (not a stale installed copy, or a bare folder of the same name)
pythonpath = ["."]
addopts = "-ra"
markers = [
    "gpu: needs an NVIDIA GPU with cupy and numba.cuda (skipped automatically when none is usable)",
    "slow: long running test",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
ignore = []
